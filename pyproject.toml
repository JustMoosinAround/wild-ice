[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildice"
version = "0.1.0"
description = "Flags Alaska lakes with snow-free ice for skating"
requires-python = ">=3.12"
dependencies = [
  "requests",
  "shapely>=2",
  "pyproj",
  "PyYAML",
  "osmium>=4.3",
]

[project.optional-dependencies]
# osm2geojson converts the Overpass-format JSON fixtures used by test_catalog.py
dev = ["pytest", "responses", "osm2geojson"]

[tool.setuptools]
packages = ["wildice"]

[tool.setuptools.package-data]
wildice = ["evalscripts/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
