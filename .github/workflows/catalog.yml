name: catalog

on:
  schedule:
    - cron: "0 12 1 * *"  # monthly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writer  # shared with daily.yml
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install .

      - name: Rebuild lake catalog
        run: python -m wildice.catalog

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/push_with_retry.sh

      - name: Notify ops on failure
        if: failure()
        env:
          NTFY_TOPIC_OPS: ${{ secrets.NTFY_TOPIC_OPS }}
        run: |
          if [ -n "${NTFY_TOPIC_OPS}" ]; then
            curl -fsS -H "Title: Wild ice catalog failed" \
              -d "workflow ${GITHUB_WORKFLOW} failed (run ${GITHUB_RUN_ID})" \
              "https://ntfy.sh/${NTFY_TOPIC_OPS}" > /dev/null
          fi
