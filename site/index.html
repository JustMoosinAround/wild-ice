<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wild Ice</title>
<meta name="description" content="Southcentral Alaska lakes with skateable ice">
<meta name="theme-color" content="#04090c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wild Ice">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="banner" hidden></div>
<header id="bar">
  <h1>Wild Ice</h1>
  <div class="search" role="search">
    <input id="q" type="search" placeholder="Find a lake" autocomplete="off" enterkeyhint="search"
      aria-label="Find a lake by name" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
    <ul id="results" role="listbox" hidden></ul>
  </div>
</header>
<main id="views">
  <section id="explore-view" class="view" hidden aria-label="Lakes that are in"></section>
  <div id="map"></div>
  <section id="mine-view" class="view" hidden aria-label="My lakes"></section>
  <section id="upload-view" class="view" hidden aria-label="Upload a track"></section>
</main>
<nav id="tabs" aria-label="Sections">
  <button type="button" data-tab="explore"><span aria-hidden="true">◎</span>Explore</button>
  <button type="button" data-tab="map"><span aria-hidden="true">⌖</span>Map</button>
  <button type="button" data-tab="mine"><span aria-hidden="true">♡</span>My lakes</button>
  <button type="button" data-tab="upload"><span aria-hidden="true">⇪</span>Upload</button>
</nav>
<div id="msg" hidden></div>
<section id="panel" hidden aria-live="polite"></section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
