region:
  bbox: [59.3, -152.5, 62.8, -144.0]  # south, west, north, east
filters:
  min_area_acres: 20
  max_road_miles: 2
  max_trail_miles: 1
ice:
  # Ashton (1989) thin-ice growth: heat transfer from ice to air, W/m^2/K.
  # 20 fits St. Lawrence River data; calmer lakes grow ice slower (lower value).
  ashton_h: 20
  skate_cm: 10
  open_cm: 2
snow:
  cover_cm: 2
reset:  # placeholders, tuned by backtest
  rain_mm: 5
  thaw_days: 2
  wind_gust_kmh: 60
  light_snow_cm: 5
imagery:  # placeholders, tuned by backtest
  min_valid_fraction: 0.7
  fresh_days: 3
  shore_buffer_m: 30
  snow_ndsi: 0.4
  snow_brightness: 0.3
  dark_brightness: 0.12
  s1_frozen_delta_db: 3.0
  lookback_days: 14
  monthly_request_budget: 9000
  max_lakes_per_day: 100       # cap even when lots of the month's budget is left
  max_minutes_per_run: 45      # stop requesting so the run can save and publish
  # low sun (MM-DD, wraps the new year): dark S2 is capped at medium and does not
  # confirm a clearing
  low_sun_start: "11-25"
  low_sun_end: "01-15"
weather:
  batch_pause_s: 10  # pause between Open-Meteo requests
site:
  base_url: "https://justmoosinaround.github.io/wild-ice"
season_start: "10-01"
# Lakes skated before (from Strava tracks): always checked first and listed first.
pinned:
  - r1539147  # Big Lake
  - w59020753  # Cheney Lake
  - w28618012  # Conners Lake
  - r1569846  # Cooper Lake
  - w49200373  # Eklutna Lake
