region:
  bbox: [59.3, -152.5, 62.8, -144.0]  # south, west, north, east
filters:
  # Smallest lake kept. Beside a road a small pond is worth a quick look, so the minimum
  # slides from min_area_acres_at_road (0 mi) up to min_area_acres (max_road_miles).
  # Trail-only lakes need min_area_acres.
  min_area_acres: 50
  min_area_acres_at_road: 5
  max_road_miles: 2
  max_trail_miles: 1
ice:
  # Ashton (1989) thin-ice growth: heat transfer from ice to air, W/m^2/K.
  # 20 fits St. Lawrence River data; calmer lakes grow ice slower (lower value).
  ashton_h: 20
  skate_cm: 10
  open_cm: 2
  # Lake water temperature on season_start. Water trails the air by a lag that grows
  # with lake size, so ice starts only once the water has cooled to 0 C. 7 C matches
  # the Wolverine Lake (Mat-Su) logger on Oct 1.
  water_start_c: 7
snow:
  cover_cm: 2
reset:  # placeholders, tuned by backtest
  rain_mm: 5
  thaw_days: 2
  wind_gust_kmh: 60
  light_snow_cm: 5
imagery:  # placeholders, tuned by backtest
  min_valid_fraction: 0.7
  fresh_days: 3
  shore_buffer_m: 30
  snow_ndsi: 0.4
  snow_brightness: 0.36
  dark_brightness: 0.155
  s1_frozen_delta_db: 3.0
  lookback_days: 14
  monthly_request_budget: 9000
  max_lakes_per_day: 150       # cap even when lots of the month's budget is left
  max_minutes_per_run: 45      # stop requesting so the run can save and publish
  # low sun (MM-DD, wraps the new year): dark S2 is capped at medium and does not
  # confirm a clearing
  low_sun_start: "11-25"
  low_sun_end: "01-15"
  # Landsat 8-9: matched to same-day Sentinel-2 looks on skated lakes (2018-2025).
  # It shares snow_ndsi. Dark open water read +1.1 to +5 C on its thermal band,
  # dark ice +0.7 C or colder.
  ls_snow_brightness: 0.30
  ls_dark_brightness: 0.15
  ls_open_water_c: 1.5
weather:
  batch_pause_s: 10  # pause between Open-Meteo requests
site:
  base_url: "https://justmoosinaround.github.io/wild-ice"
season_start: "10-01"
# Lakes skated before (from Strava tracks): always checked first and listed first.
pinned:
  - r1539147  # Big Lake
  - w59020753  # Cheney Lake
  - w28618012  # Conners Lake
  - r1569846  # Cooper Lake
  - w49200373  # Eklutna Lake
  - r1569302  # Grant Lake
  - r1527882  # Kenai Lake
  - r21378422  # Portage Lake
  - w35108034  # Rabbit Lake
  - r1555333  # Skilak Lake
  - w111498564  # Summit Lake
  - r1568486  # Upper Trail Lake
  - r2424742  # unnamed
  - w230254092  # unnamed
  - r8922352  # unnamed
hidden: []
