region:
  bbox: [59.3, -152.5, 62.8, -144.0]  # south, west, north, east
filters:
  # Smallest lake kept. Beside a road a small pond is worth a quick look, so the minimum
  # slides from min_area_acres_at_road (0 mi) up to min_area_acres (max_road_miles).
  # Trail-only lakes need min_area_acres.
  min_area_acres: 50
  min_area_acres_at_road: 5
  max_road_miles: 2
  max_trail_miles: 1
ice:
  # Ashton (1989) thin-ice growth: heat transfer from ice to air, W/m^2/K.
  # 20 fits St. Lawrence River data; calmer lakes grow ice slower (lower value).
  ashton_h: 20
  skate_cm: 5    # owner: past 2" of ice, thickness doesn't matter for skating
  open_cm: 2
  # Lake water temperature on season_start. Water trails the air by a lag that grows
  # with lake size, so ice starts only once the water has cooled to 0 C. 7 C matches
  # the Wolverine Lake (Mat-Su) logger on Oct 1.
  water_start_c: 7
snow:
  cover_cm: 2
  # Near freezing, the weather model often calls wet snow "rain". Nov 18-19 2026 around
  # Anchorage: 27 mm recorded as rain at daily means of +0.9/+1.5 C fell as 4-8 in of
  # wet snow (owner). So rain on a day with a mean at or below wet_snow_max_c counts as
  # snow at wet_snow_cm_per_mm (15 cm / 27 mm).
  wet_snow_max_c: 2.0
  wet_snow_cm_per_mm: 0.55
reset:  # placeholders, tuned by backtest
  rain_mm: 5
  thaw_days: 2
  wind_gust_kmh: 60
  light_snow_cm: 5
imagery:  # placeholders, tuned by backtest
  min_valid_fraction: 0.7
  fresh_days: 3
  shore_buffer_m: 30
  snow_ndsi: 0.4
  snow_brightness: 0.36
  dark_brightness: 0.155
  s1_frozen_delta_db: 3.0
  # Skip Sentinel-2 / Landsat scenes at or above this cloud cover (the catalog's
  # whole-scene figure, like Copernicus Browser's cloud slider). High on purpose: a lake
  # can sit in a clear hole, and winter snow is often counted as cloud. Lower it once the
  # daily logs show how many skipped scenes would have been clear over lakes.
  max_scene_cloud_pct: 95
  # Patchy lake: grey (older, dusted) ice next to black patches that may be open water
  # or newer, thinner ice (lakeice.org: ice edges, polynyas). Measured as p95 - p75
  # green reflectance. On 344 thumbnails: evenly black lakes 0.003 (90% under 0.010),
  # grey-and-black lakes 0.030 (90% over 0.017).
  patchy_texture: 0.015
  patch_days: 21
  # Crack network (owner, from Skilak Feb 2025): thin white lines of cracks and ridges
  # mean bare ice; open water and snow cover can't show them. Calibrated on 10 skated,
  # 2 snowy and 4 open-water days (reference/cracks/RESULTS.md): 7 skated >= 1%,
  # snow <= 0.6%, open water <= 0.3%.
  crack_min_frac: 0.01
  crack_res_m: 10
  crack_max_px: 1500      # ~9 processing units; checked only on lakes thick enough to skate
  crack_checks_per_run: 15
  lookback_days: 14
  monthly_request_budget: 9000
  max_lakes_per_day: 150       # cap even when lots of the month's budget is left
  max_minutes_per_run: 45      # stop requesting so the run can save and publish
  # low sun (MM-DD, wraps the new year): dark S2 is capped at medium and does not
  # confirm a clearing
  low_sun_start: "11-25"
  low_sun_end: "01-15"
  # Landsat 8-9: matched to same-day Sentinel-2 looks on skated lakes (2018-2025).
  # It shares snow_ndsi. Dark open water read +1.1 to +5 C on its thermal band,
  # dark ice +0.7 C or colder.
  ls_snow_brightness: 0.30
  ls_dark_brightness: 0.15
  ls_open_water_c: 1.5
  # Owner: dark doesn't mean ice: open water is dark too. A dark Landsat look this cold
  # (surface temperature, C) is ice; a dark look on its own needs cracks, radar or a report.
  ls_ice_c: -1.0
ridges:  # pressure-ridge warnings (lakeice.org); placeholders until we have reports
  min_span_mi: 1.0
  warmup_c: 8
  window_days: 3
  thaw_gust_kmh: 40
  points_index: 2.5   # about the most convoluted quarter of big lakes (Kenai, Skilak)
  big_ice_mi: 3.0     # lakeice.org "Big Ice": wind and currents dominate past a few miles
  lead_min_span_mi: 2.0  # lakeice.org "Leads": a 2-mile sheet split in ~30 mph wind on 4" ice
  lead_gust_kmh: 45
  lead_max_cm: 15

thaw:  # lakeice.org "Thawed Ice", "Small Ponds", "New-ice Holes"; F rates converted to C
  # Ashton's ice-decay method on Bilello's Canada/Alaska data: 0.15"/thaw degree-day F
  # on average (6 TDD per inch), 0.08" slowest (12), 0.25" fastest (4).
  loss_cm_per_cdd: 0.69
  slow_cm_per_cdd: 0.37   # low sun: little sunlight to drive melt
  fast_cm_per_cdd: 1.14   # "a 24 hour, 50 degree thaw with 20-30 mph wind melts a couple inches"
  windy_gust_kmh: 40
  shallow_m: 2.0          # "ponds often melt faster than deep lakes"
  recover_days: 3         # "the ice typically recovers after a few cold days"
  lookback_days: 30
  weak_cdd: 8             # "15 thaw degree days with some wind" (F) fill a sheet with holes
  rotten_cdd: 57          # 103 TDD (F) rotted 13.5" candled ice past holding a person
  new_ice_days: 7         # new-ice holes stay open "for days to as long as a week or more"
  slush_ratio: 0.5        # snow over ~50% of the ice thickness pushes it under water

snowobs:  # measured new snow from SNOTEL + CoCoRaHS stations replaces the weather model's
  max_km: 25
  max_dz_m: 300
  lowland_m: 400
  note_days: 7

icelog:  # reports from the Ice Log (friends and owner), via the Cloudflare worker
  good_grade_min: "C-"   # owner: A+ ... C- is worth the drive; D+ ... F- is skateable but rough
  max_gps_m: 300         # a friend's photo/phone location this far from the lake = wrong lake

weather:
  batch_pause_s: 10  # pause between Open-Meteo requests
site:
  base_url: "https://justmoosinaround.github.io/wild-ice"
season_start: "10-01"
# Lakes skated before (from Strava tracks): always checked first and listed first.
# Pins are retired: the 14 pinned lakes became the owner's saved lakes (My lakes, Nov 2026),
# which the daily run checks every day. Lakes listed here are also checked daily.
pinned: []
# Named wetlands skated as one big area (OpenStreetMap natural=wetland, by name). Their
# colour comes only from skaters' reports: the lake ice model doesn't fit a marsh.
skate_areas:
  - Potter Marsh
hidden: []
